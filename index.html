<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダブルス戦績ノート</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f3f5f8; --panel:#ffffff; --ink:#1b2433; --muted:#5a6578; --line:#d6dce6;
  --navy:#22406b; --navy-soft:#e3eaf4; --navy-ink:#ffffff;
  --ball:#b7c41d; --ball-soft:#f1f4cf;
  --win:#1f7a4d; --win-soft:#dff1e7; --lose:#b2402f; --lose-soft:#f9e4df;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161f; --panel:#1a212d; --ink:#e5eaf2; --muted:#9aa6b8; --line:#323c4d;
    --navy:#7fa6dc; --navy-soft:#22304a; --navy-ink:#0e1522;
    --ball:#d3e04a; --ball-soft:#2f331a;
    --win:#5cc48f; --win-soft:#1b3328; --lose:#ef8b79; --lose-soft:#3a2320;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161f; --panel:#1a212d; --ink:#e5eaf2; --muted:#9aa6b8; --line:#323c4d;
  --navy:#7fa6dc; --navy-soft:#22304a; --navy-ink:#0e1522;
  --ball:#d3e04a; --ball-soft:#2f331a;
  --win:#5cc48f; --win-soft:#1b3328; --lose:#ef8b79; --lose-soft:#3a2320;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{text-wrap:balance;line-height:1.35}
.nw{white-space:nowrap}
button,input,select{font:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;min-height:44px}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
button.wide{width:100%}
button.danger{color:var(--lose);border-color:var(--lose)}
button.link{background:none;border:none;color:var(--navy);text-decoration:underline;padding:8px 4px}
input[type=text],input[type=tel],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.msg{font-size:14px;color:var(--lose);margin:8px 0 0}
.lbl{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:700}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}

/* 見出し */
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.mark{width:30px;height:30px;border-radius:50%;background:var(--ball);flex:none;position:relative;overflow:hidden}
.mark::before,.mark::after{content:"";position:absolute;width:30px;height:30px;border:2px solid #fff;border-radius:50%;top:0}
.mark::before{left:-19px}.mark::after{left:19px}
header.top h1{font-size:19px;margin:0;flex:1;min-width:0}
header.top .club{display:block;font-size:14px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conn{background:var(--lose-soft);color:var(--lose);border-radius:8px;padding:8px 12px;font-size:14px}

/* 入口 */
.gate h2{font-size:18px;margin:0 0 8px}
.gate .code{font-size:22px;letter-spacing:.15em;text-align:center;font-variant-numeric:tabular-nums}
.books{display:flex;flex-direction:column;gap:8px}
.books button{text-align:left;display:flex;align-items:center;gap:10px;min-height:56px;font-weight:700}
.books button small{margin-left:auto;font-weight:400;color:var(--muted);font-size:14px}
.sum::-webkit-details-marker{display:none}
.sum{list-style:none}
.sum::after{content:"＋";margin-left:auto;color:var(--navy);font-size:20px}
details[open] .sum::after{content:"－"}
.sum{cursor:pointer;font-weight:700;font-size:17px;min-height:44px;display:flex;align-items:center}
header.top .sw{flex:none;font-size:14px;padding:6px 10px}

/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;border:none;border-radius:0;background:none;padding:6px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--muted)}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-current=page]{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--navy)}

/* セグメント・チップ */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{padding:8px 4px;font-size:15px;line-height:1.3}
.seg small{font-size:14px}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border-radius:22px;padding:6px 14px}
.chips button[aria-pressed=true]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.chips button.taken{opacity:.35}
.grade{font-size:14px;color:var(--muted);margin:10px 0 4px}
.grade:first-child{margin-top:0}
.pairbox{display:flex;align-items:center;gap:8px;background:var(--navy-soft);border-radius:8px;padding:8px 12px;margin-bottom:8px;font-weight:700;min-height:44px}
.pairbox .empty{color:var(--muted);font-weight:400}
.pairbox button{margin-left:auto;min-height:36px;padding:4px 10px;font-size:14px}
.scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.scores button{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 2px}
.scores button.w{background:var(--win-soft);border-color:var(--win);color:var(--win)}
.scores button.l{background:var(--lose-soft);border-color:var(--lose);color:var(--lose)}
.scores button[aria-pressed=true]{outline:3px solid var(--navy);outline-offset:1px}
.scorehint{font-size:14px;color:var(--muted);margin:6px 0 0}
.manual{display:flex;align-items:center;gap:8px;margin-top:8px}
.manual input{width:64px;text-align:center}

/* 絞りこみ */
.filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0}
.filters .full{grid-column:1/-1}
.minrow{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}
.minrow input{width:22px;height:22px}

/* 一覧 */
.day{font-size:15px;color:var(--muted);font-weight:700;margin:16px 0 6px}
.m{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.m .meta{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:14px;border-radius:4px;padding:0 6px;background:var(--navy-soft);color:var(--navy);font-weight:700;white-space:nowrap}
.badge.tai{background:var(--ball-soft);color:var(--ink)}
.m .ln{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:4px}
.m .side{font-weight:700;overflow-wrap:anywhere}
.m .side.r{text-align:right}
.m .side.win{color:var(--win)}
.m .sc{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 成績表 */
.st{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.st .rk{width:26px;text-align:center;font-weight:700;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;overflow-wrap:anywhere}
.st .nm small{font-size:14px;color:var(--muted)}
.st .rate{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.st .rate b{font-size:20px}
.st .rate small{display:block;font-size:14px;color:var(--muted)}
.bar{display:block;height:6px;border-radius:3px;background:var(--lose-soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--win)}
.st.out{opacity:.6}
.empty-note{color:var(--muted);text-align:center;padding:28px 8px}

/* 下から出るシート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .close{float:right;margin:-4px -4px 0 8px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--muted)}
table.tb{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.tb th,table.tb td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb th{font-size:14px;color:var(--muted);font-weight:400}

/* 部員 */
.mem{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.mem .n{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.mem .n small{font-weight:400;color:var(--muted);font-size:14px;margin-left:6px}
.mem.out .n{color:var(--muted)}
.mem button{font-size:14px;padding:4px 10px}
.add{display:grid;grid-template-columns:minmax(0,1fr) 88px auto;gap:8px}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr canvas,.qr img{background:#fff;padding:8px;border-radius:8px}
.big-code{font-size:30px;font-weight:700;letter-spacing:.15em;text-align:center;font-variant-numeric:tabular-nums;margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:22px;z-index:30;font-size:15px;max-width:90vw}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark" aria-hidden="true"></div>
    <h1>ダブルス戦績ノート<span class="club" id="clubName"></span></h1>
    <button class="sw" id="swBtn" hidden>記録帳を<br>切り替え</button>
  </header>
  <div class="conn" id="connMsg" hidden></div>

  <!-- 入口 -->
  <p class="hint" id="loading" style="text-align:center;padding:40px 0">読み込んでいます…</p>
  <section id="gate" class="gate" hidden>
    <div class="panel">
      <h2>記録帳をえらぶ</h2>
      <div class="books" id="recent"></div>
      <p class="msg" id="openMsg" hidden></p>
    </div>
    <details class="panel" id="openDetails">
      <summary class="sum">番号で開く</summary>
      <p class="hint">記録帳の6けたの番号を入れます。一度開くと、このスマホでは上の一覧に出ます。</p>
      <div class="row" style="margin-top:10px">
        <input type="tel" id="codeIn" class="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off" aria-label="記録帳の番号">
        <button class="primary" id="openBtn" style="flex:none">開く</button>
      </div>
    </details>
    <details class="panel">
      <summary class="sum">新しい記録帳を作る（先生）</summary>
      <span class="lbl" style="margin-top:12px">使い方</span>
      <div class="seg" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        <button data-kind="club" aria-pressed="false">部で使う</button>
        <button data-kind="personal" aria-pressed="true">自分用</button>
      </div>
      <p class="hint" id="kindHint"></p>
      <label class="lbl" for="clubIn">記録帳の名前</label>
      <input type="text" id="clubIn" placeholder="例：自分の試合" maxlength="30">
      <button class="primary wide" id="createBtn" style="margin-top:12px">記録帳を作る</button>
      <p class="msg" id="createMsg" hidden></p>
      <button class="link" id="localBtn" style="margin-top:6px">番号を使わず、この端末だけで試す</button>
    </details>
  </section>

  <!-- 本体 -->
  <main id="app" hidden>
    <section id="tab-rec"></section>
    <section id="tab-list" hidden></section>
    <section id="tab-ind" hidden></section>
    <section id="tab-pair" hidden></section>
    <section id="tab-mem" hidden></section>
  </main>
</div>

<nav class="tabs" id="tabs" hidden>
  <div class="in">
    <button data-tab="rec"><span class="ic" aria-hidden="true">✎</span>記録する</button>
    <button data-tab="list"><span class="ic" aria-hidden="true">≡</span>試合</button>
    <button data-tab="ind"><span class="ic" aria-hidden="true">●</span>個人</button>
    <button data-tab="pair"><span class="ic" aria-hidden="true">●●</span>ペア</button>
    <button data-tab="mem"><span class="ic" aria-hidden="true">⚙</span>部員・共有</button>
  </div>
</nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script type="module">
const firebaseConfig={
  apiKey:'AIzaSyCzxuZbLIhAKYIWGI5Q7vMscumtzwdxF0U',
  authDomain:'kissa-register.firebaseapp.com',
  projectId:'kissa-register',
  storageBucket:'kissa-register.firebasestorage.app',
  messagingSenderId:'39499958848',
  appId:'1:39499958848:web:1a8ba8004dc4611c1cada5'
};
const LS_LOCAL="doubles-record-local", LS_LAST="doubles-record-last", LS_RECENT="doubles-record-recent", LS_PREFS="doubles-record-prefs";
// 「自分用」の記録帳（meta.kind="personal"）は呼び名を変える
const P=()=>S?.meta?.kind==="personal";
const TY=()=>P()?{bu:"メンバーどうし",ren:"その他",tai:"大会"}:{bu:"部内",ren:"他校",tai:"大会"};
const TYL=()=>P()?{bu:"メンバーどうしの試合",ren:"練習試合",tai:"大会"}:{bu:"部内の練習試合",ren:"他校との練習試合",tai:"大会"};
const MEM=()=>P()?"メンバー":"部員";
const TYPES=new Proxy({},{get:(_,k)=>TY()[k]}), TYPE_LONG=new Proxy({},{get:(_,k)=>TYL()[k]});

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lsGet=(k,d)=>{try{const t=localStorage.getItem(k);return t?JSON.parse(t):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastTimer;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2000)}
function showConn(t){$("connMsg").textContent=t;$("connMsg").hidden=!t}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fy=ds=>{const [y,m]=ds.split("-").map(Number);return m>=4?y:y-1};
const fmtDate=ds=>{const d=new Date(ds+"T00:00");return `${d.getMonth()+1}/${d.getDate()}（${"日月火水木金土"[d.getDay()]}）`};
const pct=(w,n)=>n?Math.round(w/n*100):0;

/* ============ 状態 ============ */
let S=null, mode=null, code=null;      // mode: "cloud" | "local"
let prefs=Object.assign({tab:"rec",period:"fy",type:"all",min:false,showOut:false,listWho:""},lsGet(LS_PREFS,{}));
const savePrefs=()=>lsSet(LS_PREFS,prefs);
let F=null; // 記録フォーム
function newForm(keep){
  return {t:keep?.t||"bu",d:keep?.d||today(),ev:keep?.ev||"",bo:"",a:[],b:[],f:keep?.f||7,ga:null,gb:null,editId:null};
}
F=newForm();

/* ============ 保存 ============ */
let FB=null,docRef=null,unsub=null;
async function loadFirebase(){
  if(FB)return FB;
  const [app,auth,fs]=await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js")
  ]);
  const a=app.initializeApp(firebaseConfig);
  await auth.signInAnonymously(auth.getAuth(a));
  FB={...fs,db:fs.getFirestore(a)};
  return FB;
}
const refFor=c=>FB.doc(FB.db,"events","dr-"+c,"state","record");
const blankDoc=(name,kind)=>({meta:{name:name||"",kind:kind||"club",createdAt:Date.now()},members:{},matches:{}});

// field: "members" | "matches" | "meta"、key、値（null で削除）
function put(field,key,val){
  if(val===null)delete S[field][key];else S[field][key]=val;
  if(mode==="local"){lsSet(LS_LOCAL,S);renderAll();return}
  renderAll();
  FB.updateDoc(docRef,new FB.FieldPath(field,key),val===null?FB.deleteField():val)
    .catch(e=>showConn("保存できませんでした。通信を確かめて、もう一度入れてください。（"+e.code+"）"));
}

function remember(c,name,kind){
  const r=lsGet(LS_RECENT,[]).filter(x=>x.code!==c);r.unshift({code:c,name:name||"",kind:kind||"club"});lsSet(LS_RECENT,r.slice(0,6));
}
function gateMsg(id,t){$("loading").hidden=true;$("gate").hidden=false;$(id).textContent=t;$(id).hidden=false}

async function openCloud(c){
  $("openMsg").hidden=true;
  try{await loadFirebase()}catch(e){return gateMsg("openMsg","共有データに接続できませんでした。インターネット接続を確かめてください。")}
  if(unsub)unsub();
  docRef=refFor(c);
  let first=true;
  unsub=FB.onSnapshot(docRef,snap=>{
    if(!snap.exists()){
      if(first){lsSet(LS_LAST,null);return gateMsg("openMsg",`番号 ${c} の記録帳は見つかりません。番号を確かめてください。`)}
      toast("この記録帳は削除されました");return leave();
    }
    const d=snap.data();
    S={meta:d.meta||{},members:d.members||{},matches:d.matches||{}};
    if(first){first=false;mode="cloud";code=c;lsSet(LS_LAST,c);remember(c,S.meta.name,S.meta.kind);showApp()}
    else renderAll();
    showConn("");
  },e=>{
    if(first)gateMsg("openMsg","共有データを読めませんでした。（"+e.code+"）");
    else showConn("接続が切れました。ページを開き直してください。（"+e.code+"）");
  });
}
async function createCloud(name,kind){
  try{await loadFirebase()}catch(e){return gateMsg("createMsg","共有データに接続できませんでした。インターネット接続を確かめてください。")}
  let c=null;
  for(let t=0;t<8;t++){
    const cand=String(100000+Math.floor(Math.random()*900000));
    const s=await FB.getDoc(refFor(cand)).catch(()=>null);
    if(s&&!s.exists()){c=cand;break}
  }
  if(!c)return gateMsg("createMsg","番号を用意できませんでした。もう一度お試しください。");
  try{await FB.setDoc(refFor(c),blankDoc(name,kind))}catch(e){return gateMsg("createMsg","作れませんでした。（"+e.code+"）")}
  prefs.tab="mem";savePrefs();
  openCloud(c);
}
function openLocal(){
  S=lsGet(LS_LOCAL,null)||blankDoc("この端末だけ（試し）");
  S.members=S.members||{};S.matches=S.matches||{};
  mode="local";code=null;lsSet(LS_LOCAL,S);lsSet(LS_LAST,"local");showApp();
}
function leave(){
  if(unsub)unsub();unsub=null;S=null;mode=null;code=null;lsSet(LS_LAST,null);
  $("app").hidden=true;$("tabs").hidden=true;$("swBtn").hidden=true;$("loading").hidden=true;$("gate").hidden=false;$("clubName").textContent="";closeSheet();renderGate();
}

function periods(){

function inFilter(m){
  const p=prefs.period;
  if(p==="fy"&&fy(m.d)!==fy(today()))return false;
  if(p==="d30"){const lim=new Date();lim.setDate(lim.getDate()-30);if(new Date(m.d+"T00:00")<lim)return false}
  if(p.startsWith("y")&&fy(m.d)!==+p.slice(1))return false;
  if(prefs.type==="prac"&&m.t==="tai")return false;
  if(prefs.type!=="all"&&prefs.type!=="prac"&&m.t!==prefs.type)return false;

}

/* ============ 集計 ============ */
function blank(){return {pl:0,w:0,gf:0,ga:0,last:[]}}
function add(r,win,gf,ga,id){r.pl++;r.w+=win?1:0;r.gf+=gf;r.ga+=ga;r.last.push(id)}
function stats(filterFn=inFilter){
  const ind={},pair={};
  const list=Object.entries(S.matches).filter(([,m])=>filterFn(m)).sort((x,y)=>x[1].d.localeCompare(y[1].d)||x[1].at-y[1].at);
  for(const [id,m] of list){
    const aw=m.ga>m.gb;
    const sides=[[m.a,aw,m.ga,m.gb]];
    if(m.b)sides.push([m.b,!aw,m.gb,m.ga]);
    for(const [ids,win,gf,ga] of sides){
      for(const p of ids)add(ind[p]??=blank(),win,gf,ga,id);
      const k=[...ids].sort().join("+");
      add(pair[k]??=blank(),win,gf,ga,id);
    }
  }
  return {ind,pair,list};
}
function rankRows(obj){
  return Object.entries(obj).sort((x,y)=>(y[1].w/y[1].pl)-(x[1].w/x[1].pl)||y[1].pl-x[1].pl||(y[1].gf-y[1].ga)-(x[1].gf-x[1].ga));
}
function streak(r){
  // 最近5試合の勝ち負け
  return r.last.slice(-5).map(id=>{const m=S.matches[id];return m})
}
function statRow(rank,key,name,r,sub,out){
  const p=pct(r.w,r.pl),g=pct(r.gf,r.gf+r.ga);
  return `<button class="st${out?" out":""}" data-${key}>
    <span class="rk">${rank}</span>
    <span class="nm"><b>${name}</b><small><span class="nw">${r.pl}試合 ${r.w}勝${r.pl-r.w}敗</span>・<span class="nw">ゲーム ${r.gf}-${r.ga}</span></small><span class="bar"><i style="width:${p}%"></i></span></span>
    <span class="rate"><b>${p}%</b><small>ゲーム ${g}%</small></span></button>`;
}
function rankList(rows,keyFn,nameFn,outFn,minN){
  let rank=0,prev=null,shown=0;const out=[];
  for(const [k,r] of rows){
    if(prefs.min&&r.pl<minN)continue;
    if(!prefs.showOut&&outFn(k))continue;
    shown++;const v=r.w/r.pl;
    if(v!==prev){rank=shown;prev=v}
    out.push(statRow(rank,keyFn(k),nameFn(k),r,"",outFn(k)));
  }
  return out.join("");
}

function openMatchSheet(id){
  const draw=()=>{

      ${matchCard(id,m).replace("<button","<div").replace(/<\/button>$/,"</div>")}
      ${m.bo?`<p class="hint">相手：${esc(m.bo)}</p>`:""}
      <div class="row" style="margin-top:12px"><button class="primary" style="flex:1" data-act="edit" data-id="${id}">直す</button><button class="danger" style="flex:1" data-act="del" data-id="${id}">消す</button></div>`);
  };
  openSheetFn=draw;draw();
}
function editMatch(id){
  const m=S.matches[id];if(!m)return;
  F={t:m.t,d:m.d,ev:m.ev||"",bo:m.bo||"",a:[...m.a],b:[...(m.b||[])],f:m.f||7,ga:m.ga,gb:m.gb,editId:id};
  closeSheet();setTab("rec");
}
function kpi(r){
  return `<div class="kpi"><div><b>${pct(r.w,r.pl)}%</b><span>勝率</span></div><div><b>${r.w}-${r.pl-r.w}</b><span>勝-敗</span></div><div><b>${pct(r.gf,r.gf+r.ga)}%</b><span>ゲーム</span></div></div>`;
}
function typeTable(filterBase){
  const rows=[["bu",TYPES.bu],["ren",TYPES.ren],["tai","大会"]].map(([t,l])=>{
    const r=blank();
    for(const m of Object.values(S.matches)){if(!filterBase(m)||m.t!==t)continue;const s=sideOf(m);if(s)add(r,s.win,s.gf,s.ga,"")}
    return r.pl?`<tr><td>${l}</td><td>${r.pl}</td><td>${r.w}-${r.pl-r.w}</td><td>${pct(r.w,r.pl)}%</td></tr>`:"";
  }).join("");
  return rows?`<span class="lbl">試合の種類べつ</span><table class="tb"><tr><th>種類</th><th>試合</th><th>勝-敗</th><th>勝率</th></tr>${rows}</table>`:"";
}
let sideOf=()=>null;
function recentList(ids){
  return ids.slice(-10).reverse().map(id=>S.matches[id]?`<div class="day" style="margin-top:8px">${fmtDate(S.matches[id].d)}</div>`+matchCard(id,S.matches[id]):"").join("");
}
function openPersonSheet(pid){
  const draw=()=>{
    const per=m=>inFilter(m);
    const {ind,pair}=stats(per);
    const r=ind[pid];
    if(!r)return sheet(`<h3>${esc(nm(pid))}</h3><p class="empty-note">この条件の試合はありません。</p>`);
    const partners=Object.entries(pair).filter(([k])=>k.split("+").includes(pid))
      .sort((x,y)=>y[1].pl-x[1].pl);
    sideOf=m=>{if(m.a.includes(pid))return {win:m.ga>m.gb,gf:m.ga,ga:m.gb};if(m.b&&m.b.includes(pid))return {win:m.gb>m.ga,gf:m.gb,ga:m.ga};return null};
    sheet(`<h3>${esc(nm(pid))}</h3><p class="hint" style="margin:0">${esc(periods().find(p=>p[0]===prefs.period)?.[1]||"")}・${r.pl}試合</p>
      ${kpi(r)}
      <span class="lbl">パートナーべつ</span>
      <table class="tb"><tr><th>パートナー</th><th>試合</th><th>勝-敗</th><th>勝率</th></tr>
      ${partners.map(([k,x])=>`<tr><td>${esc(nm(k.split("+").find(i=>i!==pid)))}</td><td>${x.pl}</td><td>${x.w}-${x.pl-x.w}</td><td>${pct(x.w,x.pl)}%</td></tr>`).join("")}</table>
      ${typeTable(per)}
      <span class="lbl">最近の試合</span>${recentList(r.last)}`);
  };
  openSheetFn=draw;draw();
}
function openPairSheet(key){
  const draw=()=>{
    const ids=key.split("+");
    const {pair}=stats();
    const r=pair[key];
    if(!r)return sheet(`<h3>${esc(pairName(ids))}</h3><p class="empty-note">この条件の試合はありません。</p>`);
    const same=x=>x&&[...x].sort().join("+")===key;
    sideOf=m=>{if(same(m.a))return {win:m.ga>m.gb,gf:m.ga,ga:m.gb};if(same(m.b))return {win:m.gb>m.ga,gf:m.gb,ga:m.ga};return null};
    // 部内の相手ペアべつ
    const vs={};
    for(const id of r.last){const m=S.matches[id];if(!m.b)continue;const s=sideOf(m);const opp=same(m.a)?m.b:m.a;const k=pairName(opp);add(vs[k]??=blank(),s.win,s.gf,s.ga,id)}
    const vsRows=Object.entries(vs).sort((x,y)=>y[1].pl-x[1].pl);
    sheet(`<h3>${esc(pairName(ids))}</h3><p class="hint" style="margin:0">${esc(periods().find(p=>p[0]===prefs.period)?.[1]||"")}・${r.pl}試合</p>
      ${kpi(r)}
      ${typeTable(inFilter)}
      ${vsRows.length?`<span class="lbl">${TYPES.bu}の相手ペアべつ</span><table class="tb"><tr><th>相手</th><th>試合</th><th>勝-敗</th><th>勝率</th></tr>
      ${vsRows.map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.pl}</td><td>${x.w}-${x.pl-x.w}</td><td>${pct(x.w,x.pl)}%</td></tr>`).join("")}</table>`:""}
      <span class="lbl">最近の試合</span>${recentList(r.last)}`);
  };
  openSheetFn=draw;draw();
}

/* ============ 部員・共有 ============ */
function renderMem(){
  const list=membersSorted(true);
  const cnt={};for(const m of Object.values(S.matches))for(const p of [...m.a,...(m.b||[])])cnt[p]=(cnt[p]||0)+1;
  const url=location.origin+location.pathname+"?c="+code;
  $("tab-mem").innerHTML=`
  <div class="panel">
    <span class="lbl">${MEM()}を登録する</span>
    <div class="add">
      <input type="text" id="mName" maxlength="12" placeholder="名字" aria-label="名前">
      <select id="mGrade" data-f="grade" aria-label="学年">${[["1","1年"],["2","2年"],["3","3年"],["","なし"]].map(([v,l])=>`<option value="${v}" ${(prefs.grade??"2")===v?"selected":""}>${l}</option>`).join("")}</select>
      <button class="primary" data-act="addMem">登録</button>
    </div>
    <p class="hint">名字で登録します。同じ名字の人がいるときは「佐藤ゆ」のように名の1字を足してください。</p>
    <p class="msg" id="memMsg" hidden></p>
  </div>
  <div class="panel">
    <span class="lbl">${MEM()}（${list.filter(([,m])=>!m.out).length}人${list.some(([,m])=>m.out)?`・引退/退部 ${list.filter(([,m])=>m.out).length}人`:""}）</span>
    ${list.map(([id,m])=>`<div class="mem${m.out?" out":""}"><span class="n">${esc(m.n)}<small>${m.g?m.g+"年":""}${m.out?"・引退/退部":""}・${cnt[id]||0}試合</small></span>
      <button data-ren="${id}">名前</button>
      <button data-out="${id}">${m.out?"もどす":"引退"}</button>
      ${cnt[id]?"":`<button class="danger" data-del="${id}">消す</button>`}</div>`).join("")||`<p class="hint">まだいません。</p>`}
    <p class="hint">引退・退部にすると、記録するときの名前一覧から消えます（成績は残ります）。試合の記録がある人は消せません。</p>
  </div>
  ${mode==="cloud"?`<div class="panel">
    <span class="lbl">${P()?"ほかのスマホで開く":MEM()+"に伝える"}</span>
    <div class="big-code">${code}</div>
    <p class="hint" style="text-align:center;margin-top:0">この記録帳の番号（「記録帳を切り替え」→「番号で開く」で入れる）</p>
    <div class="qr" id="qr"></div>
    <button class="wide" data-act="copy">ページのアドレスをコピー</button>
    <p class="hint">${P()?`QRコードかコピーしたアドレスで、ほかのスマホからこの記録帳を開けます。番号を部員に教えない限り、部員には見えません。`:"QRコードかコピーしたアドレスで、この記録帳が直接開きます。番号やアドレスを知っている人は、だれでも見る・記録する・直すことができます。部の外の人には教えないでください。"}</p>
  </div>`:`<div class="panel"><span class="lbl">この端末だけで試しています</span><p class="hint" style="margin-top:0">記録はこのスマホ・パソコンの中だけにあります。部で共有するには、入口で「部の記録帳を作る」を押してください。</p></div>`}
  <div class="panel">
    <label class="lbl" for="clubRename">記録帳の名前</label>
    <div class="row"><input type="text" id="clubRename" value="${esc(S.meta.name||"")}" maxlength="30"><button data-act="rename" style="flex:none">変える</button></div>
  </div>`;
  if(mode==="cloud"&&window.QRCode){new QRCode($("qr"),{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}
}
$("tab-mem").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.act==="addMem"){
    const n=$("mName").value.trim().replace(/\s+/g,"");
    if(!n)return;
    if(Object.values(S.members).some(m=>m.n===n)){$("memMsg").textContent=`「${n}」はもう登録されています。名の1字を足して区別してください。`;$("memMsg").hidden=false;return}
    put("members",uid("m"),{n,g:$("mGrade").value,at:Date.now()});
    toast(n+" を登録しました");
    setTimeout(()=>$("mName")?.focus(),0);
  }
  else if(b.dataset.ren){
    const id=b.dataset.ren,m=S.members[id];
    const n=(prompt("新しい名前",m.n)||"").trim().replace(/\s+/g,"");
    if(!n||n===m.n)return;
    if(Object.entries(S.members).some(([k,x])=>k!==id&&x.n===n))return alert("その名前はもう使われています。");
    const g=prompt("学年（1・2・3、なしは空のまま）",m.g||"");
    put("members",id,{...m,n,g:g===null?m.g:g.replace(/[^123]/g,"").slice(0,1)});
  }
  else if(b.dataset.out){const id=b.dataset.out,m=S.members[id];put("members",id,{...m,out:!m.out})}
  else if(b.dataset.del){const id=b.dataset.del;if(confirm(S.members[id].n+" を消します。よろしいですか？"))put("members",id,null)}
  else if(b.dataset.act==="copy"){
    const url=location.origin+location.pathname+"?c="+code;
    try{await navigator.clipboard.writeText(url);toast("コピーしました")}catch(err){prompt("このアドレスをコピーしてください",url)}
  }
  else if(b.dataset.act==="rename"){const n=$("clubRename").value.trim();if(n)put("meta","name",n),toast("変えました")}
  else if(b.dataset.act==="leave")leave();
});
$("tab-mem").addEventListener("keydown",e=>{if(e.target.id==="mName"&&e.key==="Enter"&&!e.isComposing&&e.keyCode!==229)document.querySelector('[data-act="addMem"]').click()});

/* ============ 起動 ============ */
renderGate();
// ?c=番号 → このスマホで最後に開いた記録帳 の順に開く。どちらもなければ「記録帳をえらぶ」
const qc=new URLSearchParams(location.search).get("c"), last=lsGet(LS_LAST,null);
const start=qc&&/^\d{6}$/.test(qc)?qc:/^\d{6}$/.test(last||"")?last:null;
if(last==="local"&&!start)openLocal();
else if(start)openCloud(start);
else{$("loading").hidden=true;$("gate").hidden=false;renderGate()}
</script>
